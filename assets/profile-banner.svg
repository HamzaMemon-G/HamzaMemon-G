<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hamza Memon — Game and Software Developer</title>
  <desc id="desc">A colorful banner for Hamza Memon, also known as RADAR.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B1F"/>
      <stop offset=".48" stop-color="#241044"/>
      <stop offset="1" stop-color="#061D2D"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#06B6D4" stop-opacity=".42"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <ellipse cx="235" cy="40" rx="340" ry="250" fill="url(#violetGlow)"/>
  <ellipse cx="1035" cy="315" rx="370" ry="250" fill="url(#cyanGlow)"/>

  <path d="M0 309C194 250 334 335 520 296S860 218 1200 286V360H0Z" fill="#22D3EE" opacity=".08"/>
  <path d="M0 329C245 275 420 361 690 307S965 270 1200 319V360H0Z" fill="#A78BFA" opacity=".1"/>

  <g opacity=".8">
    <circle cx="1067" cy="98" r="72" fill="none" stroke="#FB923C" stroke-width="2"/>
    <circle cx="1067" cy="98" r="46" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="5 9"/>
    <circle cx="1067" cy="98" r="8" fill="#FB923C"/>
    <circle cx="1138" cy="98" r="5" fill="#22D3EE"/>
    <path d="M963 98h208M1067-6v208" stroke="#FFFFFF" stroke-width="1" opacity=".14"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="44" width="116" height="30" rx="15" fill="#7C3AED"/>
    <text x="118" y="64" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">RADAR</text>
  </g>

  <text x="60" y="132" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" letter-spacing="1">HAMZA MEMON</text>
  <text x="60" y="190" fill="url(#headline)" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800" letter-spacing=".5">BUILDING WORLDS. AND WHAT'S NEXT.</text>
  <text x="63" y="232" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="18">Game systems, intelligent automation, and full-stack experiences.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
    <rect x="60" y="273" width="154" height="38" rx="19" fill="#7C3AED" opacity=".9"/>
    <text x="137" y="297" text-anchor="middle" fill="#FFFFFF">GAME SYSTEMS</text>
    <rect x="226" y="273" width="178" height="38" rx="19" fill="#0891B2" opacity=".9"/>
    <text x="315" y="297" text-anchor="middle" fill="#FFFFFF">AI + AUTOMATION</text>
    <rect x="416" y="273" width="150" height="38" rx="19" fill="#EA580C" opacity=".92"/>
    <text x="491" y="297" text-anchor="middle" fill="#FFFFFF">FULL-STACK</text>
  </g>

  <rect x="0" y="351" width="400" height="9" fill="#8B5CF6"/>
  <rect x="400" y="351" width="400" height="9" fill="#06B6D4"/>
  <rect x="800" y="351" width="400" height="9" fill="#F97316"/>
</svg>
